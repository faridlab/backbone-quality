# =============================================================================
# Domain: Quality
# Entity: QualityProcedure
# Description: A documented quality procedure, arranged as a lightweight adjacency-list tree
# (`parent_procedure_id`, per brief §6.4 — not a Frappe nested-set). A CAPA (QualityAction) references
# the procedure it enacts. Posts NO GL.
#
# Tenancy: none, by design (ADR-0029). The module is tenant-agnostic; a composing
# service's tenancy decorator owns org scoping for this table.
# =============================================================================

models:
  - name: QualityProcedure
    collection: quality_procedures
    description: "A documented procedure (adjacency-list tree)"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique procedure id"
      procedure_name:
        type: string
        attributes: ["@required", "@max(200)"]
        description: "Procedure name"
      parent_procedure_id:
        type: uuid?
        attributes: ["@foreign_key(QualityProcedure.id)"]
        description: "Parent procedure (tree); NULL for a top-level procedure"
      description:
        type: string?
        attributes: ["@max(4000)"]
        description: "Procedure detail"
      # replaces is_active (boolean flipped to lifecycle enum)
      status:
        type: QualityProcedureStatus
        attributes: ["@default(active)"]
        description: "Lifecycle (inactive procedures are superseded; CAPA history keeps referencing them)"
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
    indexes:
      # No tenancy indexes (ADR-0029): the module is tenant-agnostic; the composing
      # service's tenancy decorator owns org scoping for this table (the status
      # listing index re-lands org-scoped at composition time).
      - type: index
        fields: [parent_procedure_id]

enums:
  - name: QualityProcedureStatus
    description: "Lifecycle of a quality procedure"
    variants:
      - name: active
        description: "The procedure is current"
        default: true
      - name: inactive
        description: "Superseded; new CAPAs pick a current procedure, history keeps the reference"
